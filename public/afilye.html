<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vin Afilye — Rechaj</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-inner">
    <a href="/" class="brand" style="text-decoration:none; color:inherit;">
      <span class="brand-mark">⚡</span>
      <span class="brand-name">Rechaj</span>
    </a>
  </div>
</header>

<section class="affil-hero wrap">
  <h1>Fè kòb ak lyen ou</h1>
  <p>Pataje lyen pèsonèl ou. Chak fwa yon moun achte ak lyen ou, ou fè kòmisyon.</p>
  <div class="affil-rate">8% sou chak kòmand peye</div>
</section>

<main class="wrap">
  <form class="affil-form" id="affil-form">
    <div class="field-group">
      <label>Non konplè</label>
      <input type="text" name="nom" required />
    </div>
    <div class="field-group">
      <label>Nimewo telefòn</label>
      <input type="text" name="telephone" required />
    </div>
    <button type="submit" class="btn btn-primary">Vin afilye</button>
    <p class="error-msg" id="affil-error"></p>
  </form>

  <div class="affil-result" id="affil-result" style="display:none;"></div>
</main>

<footer class="footer">
  <div class="wrap">
    <p>Kòmisyon yo kredite lè admin konfime kòmand lan peye. Kontakte nou pou resevwa lajan ou.</p>
  </div>
</footer>

<script>
document.getElementById("affil-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById("affil-error");
  errorEl.textContent = "";

  const formData = new FormData(e.target);
  try {
    const res = await fetch("/api/affiliates/inscription", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        nom: formData.get("nom"),
        telephone: formData.get("telephone"),
      }),
    });
    const data = await res.json();
    if (!res.ok) {
      errorEl.textContent = data.erreur || "Yon erè pase.";
      return;
    }

    const lyen = `${window.location.origin}/?ref=${data.code}`;
    document.getElementById("affil-form").style.display = "none";
    const result = document.getElementById("affil-result");
    result.style.display = "block";
    result.innerHTML = `
      <h2 style="font-family:var(--font-display); margin-top:0;">Byenveni, ${data.nom} 🎉</h2>
      <p>Kòd ou: <span class="mono">${data.code}</span></p>
      <p>Lyen pou pataje:</p>
      <div class="affil-link-box">${lyen}</div>
      <button class="btn btn-secondary" onclick="navigator.clipboard.writeText('${lyen}')">Kopye lyen an</button>
    `;
  } catch (err) {
    errorEl.textContent = "Pa t rive kontakte sèvè a.";
  }
});
</script>

</body>
</html>
